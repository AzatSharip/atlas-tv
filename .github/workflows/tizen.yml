name: Tizen source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-atlas-folders.cjs
      - run: node scripts/test-atlas-folder-filter.cjs
      - run: python3 -m unittest discover -s server -p 'test_*.py'
      - name: Profiles, video controls and authenticated artwork regression tests
        run: npm test -w @moonfin/app -- --runInBand --watch=false --silent src/views/Player/vodRecovery.test.js src/services/playback.capabilities.test.js src/services/playback.liveStream.test.js src/views/Player/useLiveRecovery.test.js src/services/linkBitrate.test.js src/utils/authenticatedImageUrl.test.js src/context/FamilyAuthContext.test.js src/context/SettingsContext.hydration.test.js src/services/storage.family.test.js src/components/ResumeDialog/ResumeDialog.test.js src/utils/videoResume.test.js src/utils/familySettings.test.js src/components/MediaCard/modernCardLayout.test.js
      - run: npm run build:tizen:oblong -- --skip-tizen-cli
